{% extends "base.html" %}

{% block content %}

<h1>Admin Login</h1>

<form action="/admin/login" method="POST">

    <label>Username:</label><br>
    <input type="text" name="username" required>

    <br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required>

    <br><br>

    <button type="submit">Admin Login</button>

</form>

{% endblock %}
