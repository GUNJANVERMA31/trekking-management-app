<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Trek Status</title>
</head>

<body>

<h1>📌 Update Trek Status</h1>

<h2>🏔️ {{ trek[0] }}</h2>

<p>
    Current Status:
    <strong>{{ trek[1] }}</strong>
</p>

<form method="POST">

    <label>New Status:</label>

    <select name="status" required>

        <option value="Open"
            {% if trek[1] == "Open" %}selected{% endif %}>
            Open
        </option>

        <option value="Started"
            {% if trek[1] == "Started" %}selected{% endif %}>
            Started
        </option>

        <option value="Completed"
            {% if trek[1] == "Completed" %}selected{% endif %}>
            Completed
        </option>

        <option value="Closed"
            {% if trek[1] == "Closed" %}selected{% endif %}>
            Closed
        </option>

    </select>

    <button type="submit">
        Update Status
    </button>

</form>

<br>

<a href="/staff/assigned_treks">
    ← Back to Assigned Treks
</a>

</body>
</html>
