{% extends "base.html" %}

{% block content %}

<div class="text-center mb-4">
    <h1 class="fw-bold">📖 My Bookings</h1>
    <p class="text-muted">
        View your booked trekking packages.
    </p>
</div>

<div class="card shadow-sm border-0">

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Trek Name</th>
                        <th>Location</th>
                        <th>Duration</th>
                        <th>Difficulty</th>
                        <th>Price</th>
                    </tr>
                </thead>

                <tbody>

                    {% for booking in bookings %}

                    <tr>
                        <td class="fw-semibold">
                            {{ booking[0] }}
                        </td>

                        <td>
                            📍 {{ booking[1] }}
                        </td>

                        <td>
                            {{ booking[2] }}
                        </td>

                        <td>
                            <span class="badge bg-warning text-dark">
                                {{ booking[3] }}
                            </span>
                        </td>

                        <td class="fw-bold">
                            ₹{{ booking[4] }}
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
