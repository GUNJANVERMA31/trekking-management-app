

{% extends "base.html" %}

{% block content %}

<h1>My Bookings</h1>

<table border="1">

<tr>
    <th>Trek Name</th>
    <th>Location</th>
    <th>Duration</th>
    <th>Difficulty</th>
    <th>Price</th>
</tr>

{% for booking in bookings %}

<tr>
    <td>{{booking[0]}}</td>
    <td>{{booking[1]}}</td>
    <td>{{booking[2]}}</td>
    <td>{{booking[3]}}</td>
    <td>{{booking[4]}}</td>
</tr>

{% endfor %}
{% endblock %}
