<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
</head>

<body>

<h1>👤 My Profile</h1>

<form method="POST">

    <label>Full Name:</label><br>
    <input
        type="text"
        name="fullname"
        value="{{ user[0] }}"
        required
    >

    <br><br>

    <label>Email:</label><br>
    <input
        type="email"
        name="email"
        value="{{ user[1] }}"
        required
    >

    <br><br>

    <label>Password:</label><br>
    <input
        type="password"
        name="password"
        value="{{ user[2] }}"
        required
    >

    <br><br>

    <button type="submit">
        Update Profile
    </button>

</form>

<br>

<a href="/dashboard" class="btn btn-secondary">
    ← Back to Dashboard
</a>

</body>
</html>
